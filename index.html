<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
<title>TITAN PRO - Ultimate</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #050b10;
  --glass: rgba(14, 38, 48, 0.7);
  --glass-border: rgba(0, 229, 255, 0.15);
  --primary: #00e5ff;
  --secondary: #1e90ff;
  --text: #f0f8ff;
  --muted: #7fa8b5;
  --danger: #ff4757;
  --success: #2ed573;
  --warn: #ffa502;
}
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
body { background: var(--bg); color: var(--text); width: 100vw; height: 100vh; overflow: hidden; }

/* Nền động */
.bg-fx { position: fixed; inset: 0; z-index: -1; background: radial-gradient(circle at 50% 0%, #0e3b4a 0%, #050b10 70%); }
.bg-fx::before, .bg-fx::after { content: ''; position: absolute; width: 400px; height: 400px; border-radius: 50%; background: var(--primary); filter: blur(120px); opacity: 0.1; animation: float 10s infinite alternate; }
.bg-fx::before { top: -20%; left: -20%; }
.bg-fx::after { bottom: -20%; right: -20%; background: var(--secondary); animation-delay: -5s; }
@keyframes float { 100% { transform: translate(100px, 100px); } }

/* Màn hình */
.screen { display: none; position: fixed; inset: 0; padding: 24px; overflow-y: auto; z-index: 10; }
.screen.active { display: flex; flex-direction: column; animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1); }
@keyframes slideUp { from { opacity: 0; transform: translateY(30px) scale(0.98); } to { opacity: 1; transform: none; } }

/* Glassmorphism */
.glass { background: var(--glass); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid var(--glass-border); border-radius: 24px; padding: 24px; box-shadow: 0 12px 40px rgba(0,0,0,0.5); }

/* SPLASH */
#splash { justify-content: center; align-items: center; text-align: center; }
.logo { font-size: 72px; font-weight: 900; letter-spacing: 10px; background: linear-gradient(135deg, #fff, var(--primary), var(--secondary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; filter: drop-shadow(0 0 20px rgba(0,229,255,0.4)); margin-bottom: -10px; }
.sub { font-size: 14px; font-weight: 600; letter-spacing: 8px; color: var(--primary); margin-bottom: 40px; }
.slider-wrap { width: 100%; max-width: 300px; }
input[type=range] { -webkit-appearance: none; width: 100%; height: 8px; border-radius: 8px; background: rgba(255,255,255,0.1); outline: none; }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 28px; height: 28px; border-radius: 50%; background: #fff; border: 4px solid var(--primary); box-shadow: -300px 0 0 290px var(--primary); cursor: pointer; }
.percent { font-size: 32px; font-weight: 900; color: var(--primary); margin-top: 20px; font-variant-numeric: tabular-nums; }
.status { font-size: 13px; color: var(--muted); margin-top: 8px; letter-spacing: 1px; }

/* KEY */
#keyScreen { justify-content: center; align-items: center; }
.key-card { width: 100%; max-width: 340px; text-align: center; }
.icon-key { font-size: 48px; margin-bottom: 16px; }
.title-key { font-size: 22px; font-weight: 800; margin-bottom: 24px; }
.input-key { width: 100%; padding: 18px; border-radius: 16px; border: 1px solid var(--glass-border); background: rgba(0,0,0,0.4); color: var(--text); font-size: 18px; text-align: center; letter-spacing: 4px; text-transform: uppercase; outline: none; font-weight: 700; transition: 0.3s; }
.input-key:focus { border-color: var(--primary); box-shadow: 0 0 20px rgba(0,229,255,0.2); }
.btn-primary { width: 100%; padding: 18px; border-radius: 16px; border: none; background: linear-gradient(135deg, var(--primary), var(--secondary)); color: #000; font-size: 16px; font-weight: 800; cursor: pointer; letter-spacing: 1px; margin-top: 16px; transition: 0.2s; }
.btn-primary:active { transform: scale(0.96); }
.msg { font-size: 13px; font-weight: 600; margin-top: 16px; min-height: 20px; color: var(--danger); }
.msg.ok { color: var(--success); }

/* APP */
#appScreen { padding: 0; display: none; }
#appScreen.active { display: block; }
.topbar { position: sticky; top: 0; z-index: 50; background: rgba(5,11,16,0.85); backdrop-filter: blur(15px); border-bottom: 1px solid var(--glass-border); padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; }
.brand { font-size: 20px; font-weight: 900; background: linear-gradient(90deg, var(--primary), var(--secondary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: 1px; }
.timer { font-size: 11px; font-weight: 700; color: var(--primary); background: rgba(0,229,255,0.1); padding: 8px 14px; border-radius: 20px; border: 1px solid rgba(0,229,255,0.3); font-variant-numeric: tabular-nums; }
.tabs { display: flex; gap: 8px; padding: 16px 20px; overflow-x: auto; position: sticky; top: 65px; background: var(--bg); z-index: 40; border-bottom: 1px solid rgba(255,255,255,0.05); }
.tab { flex: 0 0 auto; padding: 12px 20px; border-radius: 12px; background: rgba(255,255,255,0.03); color: var(--muted); font-size: 13px; font-weight: 600; border: 1px solid transparent; cursor: pointer; transition: 0.2s; }
.tab.active { background: rgba(0,229,255,0.15); color: var(--primary); border-color: rgba(0,229,255,0.4); }
.content { padding: 20px 20px 100px 20px; }
.page { display: none; }
.page.active { display: block; animation: fadeIn 0.4s; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

.card { background: var(--glass); border: 1px solid var(--glass-border); border-radius: 20px; padding: 20px; margin-bottom: 16px; }
.lbl { display: block; font-size: 12px; font-weight: 700; color: var(--primary); margin-bottom: 12px; text-transform: uppercase; letter-spacing: 1px; }
.select-box, .file-box { width: 100%; padding: 16px; border-radius: 12px; background: rgba(0,0,0,0.4); border: 1px solid var(--glass-border); color: var(--text); font-size: 14px; outline: none; }
.log { background: #020507; border-radius: 12px; padding: 14px; font-family: 'Consolas', monospace; font-size: 12px; color: var(--success); max-height: 160px; overflow-y: auto; white-space: pre-wrap; margin-top: 12px; border: 1px solid rgba(46,213,115,0.2); }
.btn-inject { width: 100%; padding: 20px; border-radius: 20px; border: none; background: linear-gradient(135deg, var(--danger), #ff6b81); color: #fff; font-size: 18px; font-weight: 900; cursor: pointer; box-shadow: 0 10px 30px rgba(255,71,87,0.4); margin-bottom: 20px; letter-spacing: 2px; transition: 0.2s; }
.btn-inject:active { transform: scale(0.97); }
.chk-row { display: flex; align-items: center; gap: 12px; padding: 12px 0; font-size: 14px; color: var(--text); cursor: pointer; }
.chk-row input { width: 22px; height: 22px; accent-color: var(--primary); cursor: pointer; }
.range-val { float: right; color: var(--primary); font-weight: 800; font-size: 16px; }

/* LOADING OVERLAY */
.overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 100; align-items: center; justify-content: center; padding: 20px; backdrop-filter: blur(5px); }
.overlay.show { display: flex; animation: fadeIn 0.3s; }
.term { width: 100%; max-width: 420px; background: #000; border: 1px solid var(--primary); border-radius: 20px; padding: 24px; box-shadow: 0 0 40px rgba(0,229,255,0.2); }
.term h3 { color: var(--primary); font-size: 14px; margin-bottom: 16px; letter-spacing: 3px; text-align: center; display: flex; align-items: center; justify-content: center; gap: 10px; }
.spinner { width: 16px; height: 16px; border: 2px solid rgba(0,229,255,0.3); border-top-color: var(--primary); border-radius: 50%; animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.term pre { font-family: 'Consolas', monospace; font-size: 12px; color: var(--success); line-height: 1.6; max-height: 300px; overflow-y: auto; }
</style>
</head>
<body>
<div class="bg-fx"></div>

<!-- MÀN 1: SPLASH -->
<div id="splash" class="screen active">
  <div class="logo">TITAN</div>
  <div class="sub">PRO INJECTOR</div>
  <div class="slider-wrap">
    <input type="range" id="bootSlider" min="1" max="100" value="1"/>
    <div class="percent"><span id="bootVal">1</span>%</div>
    <div class="status" id="bootStatus">Đang khởi động hệ thống...</div>
  </div>
</div>

<!-- MÀN 2: KEY -->
<div id="keyScreen" class="screen">
  <div class="key-card glass">
    <div class="icon-key">🔑</div>
    <div class="title-key">KÍCH HOẠT BẢN QUYỀN</div>
    <input id="keyInput" class="input-key" maxlength="20" placeholder="TITAN-XXXX-XXXX" autocomplete="off"/>
    <button id="keyBtn" class="btn-primary">XÁC THỰC NGAY</button>
    <div id="keyMsg" class="msg"></div>
    <div style="font-size:11px; color:var(--muted); margin-top:20px;">Thời hạn 14 ngày • Khóa cứng thiết bị</div>
  </div>
</div>

<!-- MÀN 3: APP CHÍNH -->
<div id="appScreen" class="screen">
  <div class="topbar">
    <div class="brand">TITAN PRO</div>
    <div class="timer" id="timer">--d --h --m</div>
  </div>
  
  <div class="tabs">
    <button class="tab active" data-tab="1">Trang App</button>
    <button class="tab" data-tab="2">Chức Năng</button>
    <button class="tab" data-tab="3">Hỗ Trợ</button>
    <button class="tab" data-tab="4">Cài Đặt</button>
  </div>

  <div class="content">
    <!-- TAB 1 -->
    <div class="page active" id="page-1">
      <div class="card">
        <label class="lbl">📁 CHỌN FILE TỪ THIẾT BỊ</label>
        <input type="file" id="filePicker" class="file-box"/>
        <div id="fileName" style="font-size:13px; color:var(--primary); margin-top:12px; font-weight:600;">Chưa chọn tệp</div>
        <div id="fileLog" class="log">Chọn file để xem nội dung...</div>
      </div>
      
      <div class="card">
        <label class="lbl">⚙️ HỆ THỐNG ENGINE</label>
        <div id="engineList" style="display:flex; flex-wrap:wrap; gap:6px; font-size:11px;"></div>
      </div>

      <button id="injectBtn" class="btn-inject">⚡ INJECT GAME</button>
    </div>

    <!-- TAB 2 -->
    <div class="page" id="page-2">
      <div class="card">
        <label class="lbl">🎯 TỐC ĐỘ NHẠY MÁY <span class="range-val" id="vSens">1.0x</span></label>
        <input type="range" id="sens" min="0.1" max="3" step="0.1" value="1"/>
      </div>
      
      <div class="card">
        <label class="lbl">📺 ĐỘ PHÂN GIẢI</label>
        <select id="res" class="select-box">
          <option value="1280x720">HD 1280x720</option>
          <option value="1920x1080" selected>FHD 1920x1080</option>
          <option value="2560x1440">QHD 2560x1440</option>
          <option value="3840x2160">4K 3840x2160</option>
        </select>
      </div>

      <div class="card">
        <label class="lbl">⚡ TỐC ĐỘ CHẠY FILE <span class="range-val" id="vSpeed">1.0x</span></label>
        <input type="range" id="speed" min="0.1" max="3" step="0.1" value="1"/>
      </div>

      <div class="card">
        <label class="lbl">🛠 CHỌN MODE TỐI ƯU</label>
        <label class="chk-row"><input type="checkbox" id="modeLight"/> Nhẹ - Tăng nhạy +69% vuốt</label>
        <label class="chk-row"><input type="checkbox" id="modeTune"/> Tinh chỉnh - Đầm nhạy, bám cao</label>
        <label class="chk-row"><input type="checkbox" id="modePrecise"/> Chính xác - Tuyệt đối, không giảm</label>
      </div>

      <div class="card">
        <div id="paramsLog" class="log">Chưa lưu thông số...</div>
      </div>
    </div>

    <!-- TAB 3 -->
    <div class="page" id="page-3">
      <div class="card">
        <label class="lbl">🎮 CHỌN GAME HỖ TRỢ</label>
        <select id="gameSel" class="select-box">
          <option value="">-- Chọn game --</option>
          <option value="ff">Liên Quân Mobile (FFVN)</option>
          <option value="pubg">PUBG Mobile VN</option>
          <option value="mlbb">Mobile Legends</option>
        </select>
        <div id="gameList" style="margin-top:16px; display:flex; flex-direction:column; gap:10px;"></div>
      </div>
    </div>

    <!-- TAB 4 -->
    <div class="page" id="page-4">
      <div class="card">
        <label class="lbl">📱 THÔNG TIN THIẾT BỊ</label>
        <pre id="devInfo" class="log" style="color:var(--text);">Đang tải dữ liệu...</pre>
      </div>
      <div class="card">
        <label class="lbl">⏱ THỜI GIAN SỬ DỤNG</label>
        <div id="usageTime" class="log" style="color:var(--text);">--</div>
      </div>
      <button id="restartBtn" class="btn-primary" style="background:linear-gradient(135deg,#ff4757,#ff6b81); color:#fff;">🔄 KHỞI CHẠY LẠI APP</button>
    </div>
  </div>

  <!-- INJECT LOADING -->
  <div id="injectScreen" class="overlay">
    <div class="term">
      <h3><div class="spinner"></div> ĐANG INJECT</h3>
      <pre id="injectConsole"></pre>
    </div>
  </div>
</div>

<script>
// ================= STATE =================
const state = { 
  key: null, 
  expiresAt: null, 
  params: { sens: 1, res: '1920x1080', speed: 1, mode: 'None' },
  deviceId: null
};

function goToScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  const target = document.getElementById(id);
  if (target) target.classList.add('active');
}

// ================= 1. SPLASH =================
document.getElementById('bootSlider').addEventListener('input', function() {
  document.getElementById('bootVal').textContent = this.value;
  if (this.value < 50) document.getElementById('bootStatus').textContent = 'Đang tải module lõi...';
  else if (this.value < 90) document.getElementById('bootStatus').textContent = 'Đang kết nối server...';
  else document.getElementById('bootStatus').textContent = '✅ Sẵn sàng!';
  
  if (this.value == 100) setTimeout(() => goToScreen('keyScreen'), 800);
});

// ================= 2. KEY AUTH =================
document.getElementById('keyBtn').addEventListener('click', async () => {
  const k = document.getElementById('keyInput').value.trim().toUpperCase();
  const msg = document.getElementById('keyMsg');
  const btn = document.getElementById('keyBtn');
  
  if (k.length < 12) { msg.textContent = '❌ Key không hợp lệ (cần 12 ký tự)'; return; }
  
  btn.disabled = true; btn.textContent = 'ĐANG KẾT NỐI...';
  msg.className = 'msg'; msg.textContent = '';

  try {
    const res = await fetch('/api/verify-key', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ key: k })
    });
    const data = await res.json();
    
    if (data.ok) {
      msg.className = 'msg ok'; msg.textContent = '✅ ' + data.message;
      localStorage.setItem('titan_key', k);
      localStorage.setItem('titan_exp', data.expiresAt);
      localStorage.setItem('titan_dev', data.deviceId);
      
      state.key = k; state.expiresAt = data.expiresAt; state.deviceId = data.deviceId;
      setTimeout(() => { goToScreen('appScreen'); initApp(); }, 1000);
    } else {
      msg.textContent = '❌ ' + data.message; 
      btn.disabled = false; btn.textContent = 'XÁC THỰC NGAY';
    }
  } catch (e) {
    msg.textContent = '❌ Lỗi kết nối Server'; 
    btn.disabled = false; btn.textContent = 'XÁC THỰC NGAY';
  }
});

// ================= 3. INIT APP =================
function initApp() {
  // Load Engines
  const engines = ['C++', 'Python', 'Lua', 'YAML', 'Java', 'LuaPage', 'Min', 'Nix', 'Pig', 'Prolog'];
  document.getElementById('engineList').innerHTML = engines.map(e => 
    `<span style="background:rgba(0,229,255,0.1); padding:6px 10px; border-radius:8px; color:var(--primary); border:1px solid rgba(0,229,255,0.2);">✓ ${e}</span>`
  ).join('');
  
  // Load Device Info
  fetch('/api/device-info').then(r => r.json()).then(d => {
    document.getElementById('devInfo').textContent = 
      `Platform : ${d.platform}\n` +
      `CPU Cores: ${d.cpus}\n` +
      `RAM Total: ${(d.totalmem/1073741824).toFixed(1)} GB\n` +
      `Node Ver : ${d.nodeVersion}\n` +
      `Server   : ${new Date(d.serverTime).toLocaleString()}`;
  });
  
  // Load Usage Time
  const firstOpen = localStorage.getItem('titan_first') || Date.now().toString();
  localStorage.setItem('titan_first', firstOpen);
  const diff = Math.floor((Date.now() - parseInt(firstOpen)) / 60000);
  document.getElementById('usageTime').textContent = `Lần đầu mở: ${new Date(parseInt(firstOpen)).toLocaleString()}\nTổng thời gian: ${diff} phút`;

  // Load saved params
  const saved = localStorage.getItem('titan_params');
  if (saved) {
    try { Object.assign(state.params, JSON.parse(saved)); } catch(e){}
    document.getElementById('sens').value = state.params.sens;
    document.getElementById('speed').value = state.params.speed;
    document.getElementById('res').value = state.params.res;
    document.getElementById('vSens').textContent = state.params.sens + 'x';
    document.getElementById('vSpeed').textContent = state.params.speed + 'x';
    if (state.params.mode === 'Nhẹ') document.getElementById('modeLight').checked = true;
    if (state.params.mode === 'Tinh chỉnh') document.getElementById('modeTune').checked = true;
    if (state.params.mode === 'Chính xác') document.getElementById('modePrecise').checked = true;
  }

  // Timer
  setInterval(() => {
    if (!state.expiresAt) return;
    const ms = new Date(state.expiresAt).getTime() - Date.now();
    if (ms <= 0) { alert('Key đã hết hạn!'); localStorage.clear(); location.reload(); return; }
    const d = Math.floor(ms / 86400000);
    const h = Math.floor((ms % 86400000) / 3600000);
    const m = Math.floor((ms % 3600000) / 60000);
    document.getElementById('timer').textContent = `${d}d ${h}h ${m}m`;
  }, 1000);
}

// ================= AUTO LOGIN =================
(function() {
  const k = localStorage.getItem('titan_key');
  const exp = localStorage.getItem('titan_exp');
  if (k && exp && Date.now() < new Date(exp).getTime()) {
    state.key = k; state.expiresAt = exp; state.deviceId = localStorage.getItem('titan_dev');
    goToScreen('appScreen'); initApp();
  }
})();

// ================= TABS =================
document.querySelectorAll('.tab').forEach(t => {
  t.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    document.querySelectorAll('.page').forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    document.getElementById('page-' + t.dataset.tab).classList.add('active');
  });
});

// ================= TAB 1: READ FILE =================
document.getElementById('filePicker').addEventListener('change', async (e) => {
  const f = e.target.files[0]; if (!f) return;
  document.getElementById('fileName').textContent = '📄 ' + f.name + ' (' + (f.size/1024).toFixed(1) + ' KB)';
  const text = await f.text();
  const ext = f.name.split('.').pop().toLowerCase();
  
  let engine = "Unknown";
  if (ext === 'cpp') engine = "C++";
  else if (ext === 'py') engine = "Python";
  else if (ext === 'lua') engine = "Lua";
  else if (ext === 'java') engine = "Java";
  else if (ext === 'json') engine = "JSON Data";
  else if (ext === 'html') engine = "HTML";
  
  document.getElementById('fileLog').textContent = `--- ENGINE: ${engine} ---\n` + text.substring(0, 500) + (text.length > 500 ? '\n... (đã tải toàn bộ)' : '');
});

// ================= TAB 1: INJECT =================
document.getElementById('injectBtn').addEventListener('click', () => {
  const overlay = document.getElementById('injectScreen');
  const term = document.getElementById('injectConsole');
  overlay.classList.add('show'); term.textContent = '';
  
  const logs = [
    '[*] Khởi tạo module injector...',
    '[*] Đang tìm tiến trình game (com.garena.game.kgvn)...',
    '[*] Đã tìm thấy PID: 8492',
    '[*] Decrypting libtitan.so...',
    '[*] Bypass anti-cheat (SafetyNet)... OK',
    '[*] Ghi đè bộ nhớ (Memory Patching)...',
    '[*] Áp dụng Mode: ' + state.params.mode,
    '[*] Áp dụng Sens: ' + state.params.sens + 'x | Res: ' + state.params.res,
    '[*] Tối ưu hóa FPS & Touch...',
    '[+] INJECT THÀNH CÔNG! Đang khởi chạy FFVN...'
  ];
  
  let i = 0;
  const interval = setInterval(() => {
    if (i < logs.length) { 
      term.textContent += logs[i] + '\n'; 
      term.scrollTop = term.scrollHeight;
      i++; 
    } else {
      clearInterval(interval);
      setTimeout(() => { 
        overlay.classList.remove('show'); 
        alert('✅ Đã tối ưu và khởi chạy game thành công!'); 
      }, 1000);
    }
  }, 600); // Tốc độ chạy log
});

// ================= TAB 2: PARAMS =================
function saveParams() {
  localStorage.setItem('titan_params', JSON.stringify(state.params));
  document.getElementById('paramsLog').textContent = 
    `✅ Đã lưu vào bộ nhớ:\n` +
    `- Sens: ${state.params.sens}x\n` +
    `- Res: ${state.params.res}\n` +
    `- Speed: ${state.params.speed}x\n` +
    `- Mode: ${state.params.mode}`;
}

document.getElementById('sens').addEventListener('input', function() {
  document.getElementById('vSens').textContent = this.value + 'x';
  state.params.sens = parseFloat(this.value);
  saveParams();
});
document.getElementById('speed').addEventListener('input', function() {
  document.getElementById('vSpeed').textContent = this.value + 'x';
  state.params.speed = parseFloat(this.value);
  saveParams();
});
document.getElementById('res').addEventListener('change', function() {
  state.params.res = this.value; saveParams();
});

['modeLight', 'modeTune', 'modePrecise'].forEach(id => {
  document.getElementById(id).addEventListener('change', function() {
    if (this.checked) {
      ['modeLight', 'modeTune', 'modePrecise'].forEach(x => { if (x !== id) document.getElementById(x).checked = false; });
      state.params.mode = id === 'modeLight' ? 'Nhẹ' : id === 'modeTune' ? 'Tinh chỉnh' : 'Chính xác';
    } else { state.params.mode = 'None'; }
    saveParams();
  });
});

// ================= TAB 3: GAMES =================
const games = {
  'ff': ['FPS Boost (+30%)', 'Touch Sensitivity (+69%)', 'Anti-Lag Buffer', 'Aim Assist Pro'],
  'pubg': ['Gyro Tuning', 'Recoil Control', 'Graphics Smooth', 'Memory Cleaner'],
  'mlbb': ['Skill Cast Speed', 'Map Awareness Pro', 'Ping Optimizer']
};
document.getElementById('gameSel').addEventListener('change', function() {
  const list = games[this.value] || [];
  document.getElementById('gameList').innerHTML = list.map(item => 
    `<label class="chk-row" style="background:rgba(255,255,255,0.05); padding:12px; border-radius:12px; border:1px solid rgba(255,255,255,0.05);">
      <input type="checkbox" checked/> ${item}
    </label>`
  ).join('');
});

// ================= TAB 4: RESTART =================
document.getElementById('restartBtn').addEventListener('click', () => {
  if (confirm('Xóa toàn bộ dữ liệu (bao gồm Key) và khởi chạy lại App?')) { 
    localStorage.clear(); 
    location.reload(); 
  }
});
</script>

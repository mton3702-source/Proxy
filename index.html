<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>X LOCK - DNS MAXX FF</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif; }
  html, body { background: #0a0010; height: 100%; overflow: hidden; color: #fff; -webkit-font-smoothing: antialiased; }
  .app { max-width: 480px; margin: 0 auto; height: 100vh; position: relative; overflow: hidden; }

  /* LOADING SCREEN */
  #loadingScreen {
    position: absolute; inset: 0;
    background: linear-gradient(135deg, #4a0000 0%, #6b0033 25%, #4a0080 60%, #1a0033 100%);
    display: none; flex-direction: column; align-items: center; justify-content: center;
    z-index: 999; padding: 30px;
  }
  .load-logo { width: 100px; height: 100px; border-radius: 50%;
    background: rgba(10, 0, 20, 0.85); border: 2px solid rgba(255, 0, 80, 0.6);
    display: flex; align-items: center; justify-content: center; font-size: 50px;
    box-shadow: 0 0 50px rgba(255, 0, 80, 0.7); margin-bottom: 30px;
    animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }
  .load-title { font-size: 22px; font-weight: 900; letter-spacing: 3px;
    background: linear-gradient(90deg, #FF0040, #FF00FF, #9B30FF);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text; margin-bottom: 12px; }
  .load-status { font-size: 13px; color: rgba(255, 180, 220, 0.8);
    letter-spacing: 1px; margin-bottom: 25px; min-height: 20px; text-align: center; }
  .load-bar { width: 260px; height: 6px; background: rgba(255, 255, 255, 0.1);
    border-radius: 6px; overflow: hidden; margin-bottom: 20px; }
  .load-bar-fill { height: 100%; width: 0%;
    background: linear-gradient(90deg, #FF0040, #FF00FF, #9B30FF);
    border-radius: 6px; transition: width 0.25s ease; box-shadow: 0 0 15px #FF0040; }
  .load-percent { font-family: 'Courier New', monospace; font-size: 15px;
    font-weight: 800; color: #FF00FF; text-shadow: 0 0 15px rgba(255, 0, 255, 0.7); }

  /* AUTH SCREEN */
  #authScreen {
    position: absolute; inset: 0;
    background: linear-gradient(135deg, #4a0000 0%, #6b0033 25%, #4a0080 60%, #1a0033 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 30px; z-index: 10; transition: opacity 0.5s; overflow: hidden;
  }
  #authScreen::before { content: ''; position: absolute; width: 400px; height: 400px;
    border-radius: 50%; background: radial-gradient(circle, rgba(255, 0, 80, 0.4), transparent 70%);
    top: -100px; right: -100px; animation: floatLight 6s ease-in-out infinite; }
  #authScreen::after { content: ''; position: absolute; width: 350px; height: 350px;
    border-radius: 50%; background: radial-gradient(circle, rgba(155, 48, 255, 0.4), transparent 70%);
    bottom: -100px; left: -100px; animation: floatLight 8s ease-in-out infinite reverse; }
  @keyframes floatLight { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(30px,20px) scale(1.15); } }
  .logo-wrap { position: relative; width: 130px; height: 130px;
    display: flex; align-items: center; justify-content: center; margin-bottom: 20px; z-index: 1; }
  .logo-wrap::before { content: ''; position: absolute; inset: -4px; border-radius: 50%;
    background: conic-gradient(from 0deg, #FF0040, #FF00FF, #9B30FF, #FF0040);
    animation: rotate 3s linear infinite; filter: blur(10px); opacity: 0.9; }
  @keyframes rotate { to { transform: rotate(360deg); } }
  .logo-circle { width: 118px; height: 118px; border-radius: 50%;
    background: rgba(10, 0, 20, 0.85); backdrop-filter: blur(15px);
    border: 2px solid rgba(255, 0, 80, 0.5); display: flex; align-items: center;
    justify-content: center; font-size: 58px; position: relative; z-index: 1;
    box-shadow: inset 0 0 30px rgba(255, 0, 80, 0.3); }
  .app-name { font-size: 40px; font-weight: 900; letter-spacing: 5px;
    background: linear-gradient(90deg, #FF0040 0%, #FF00FF 50%, #9B30FF 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text; text-shadow: 0 0 40px rgba(255, 0, 80, 0.6);
    margin-bottom: 6px; z-index: 1; }
  .app-sub { font-size: 12px; color: rgba(255, 200, 255, 0.7);
    letter-spacing: 3px; margin-bottom: 35px; z-index: 1; }
  .input-label { width: 100%; max-width: 340px; font-size: 11px;
    font-weight: 700; letter-spacing: 2px; color: rgba(255, 150, 200, 0.8);
    margin-bottom: 8px; z-index: 1; }
  .key-input { width: 100%; max-width: 340px; padding: 16px 18px; border-radius: 14px;
    border: 1.5px solid rgba(255, 0, 80, 0.4); background: rgba(20, 0, 30, 0.8);
    color: #fff; font-family: 'Courier New', monospace; font-size: 15px;
    font-weight: 700; letter-spacing: 1px; outline: none; transition: all 0.3s;
    z-index: 1; backdrop-filter: blur(10px); }
  .key-input::placeholder { color: rgba(255, 100, 180, 0.4); }
  .key-input:focus { border-color: #FF0040; box-shadow: 0 0 30px rgba(255, 0, 80, 0.5); }
  .error-msg { width: 100%; max-width: 340px; margin-top: 12px; padding: 10px 14px;
    background: rgba(255, 0, 60, 0.2); border: 1px solid rgba(255, 0, 60, 0.5);
    border-radius: 10px; font-size: 13px; text-align: center;
    color: #FF6688; display: none; z-index: 1; }
  .error-msg.show { display: block; animation: shake 0.4s; }
  @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
  .btn-activate { width: 100%; max-width: 340px; margin-top: 20px; padding: 16px;
    border-radius: 14px; border: none; background: linear-gradient(90deg, #FF0040, #9B30FF);
    color: #fff; font-size: 15px; font-weight: 800; letter-spacing: 2px;
    cursor: pointer; box-shadow: 0 8px 30px rgba(255, 0, 80, 0.5);
    transition: all 0.3s; display: flex; align-items: center; justify-content: center;
    gap: 10px; z-index: 1; }
  .btn-activate:active { transform: scale(0.97); }
  .btn-activate:disabled { opacity: 0.6; cursor: not-allowed; }
  .spinner { width: 18px; height: 18px; border: 3px solid rgba(255, 255, 255, 0.3);
    border-top-color: #fff; border-radius: 50%; animation: spin 0.8s linear infinite; display: none; }
  .spinner.show { display: block; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .device-info { position: absolute; bottom: 20px; font-size: 10px;
    color: rgba(255, 150, 200, 0.4); letter-spacing: 1px; z-index: 1; }

  /* MAIN SCREEN */
  #mainScreen {
    position: absolute; inset: 0;
    background: linear-gradient(180deg, #0a0010 0%, #1a0033 40%, #2d004d 75%, #4a0020 100%);
    display: none; flex-direction: column; z-index: 5;
  }
  .header { padding: 16px 18px 14px; background: rgba(0, 0, 0, 0.35);
    backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255, 0, 80, 0.15); flex-shrink: 0; }
  .header-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
  .header-left { display: flex; flex-direction: column; gap: 4px; }
  .header-title { font-size: 22px; font-weight: 900; letter-spacing: 4px;
    background: linear-gradient(90deg, #FF0040, #FF00FF);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text; line-height: 1.1; }
  .header-status { display: flex; align-items: center; gap: 6px;
    font-size: 11px; font-weight: 600; color: rgba(255, 200, 255, 0.75); letter-spacing: 1px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #00ff88;
    box-shadow: 0 0 8px #00ff88; animation: blink 1.5s infinite; }
  @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
  .header-right { text-align: right; }
  .ping-value { font-family: 'Courier New', monospace; font-size: 17px;
    font-weight: 800; color: #00ff88; line-height: 1.1; }
  .ping-label { font-size: 9px; color: rgba(255, 200, 255, 0.5);
    letter-spacing: 2px; margin-top: 2px; }
  .time-box { padding: 9px 14px;
    background: linear-gradient(90deg, rgba(255, 0, 80, 0.15), rgba(155, 48, 255, 0.15));
    border: 1px solid rgba(255, 0, 80, 0.3); border-radius: 10px;
    display: flex; justify-content: space-between; align-items: center; }
  .time-label { font-size: 12px; color: rgba(255, 200, 255, 0.8);
    display: flex; align-items: center; gap: 6px; }
  .time-value { font-family: 'Courier New', monospace; font-size: 14px;
    font-weight: 800; color: #FF00FF; text-shadow: 0 0 10px rgba(255, 0, 255, 0.5); }

  .dns-list { flex: 1; overflow-y: auto; padding: 14px 14px 20px;
    display: flex; flex-direction: column; gap: 10px; }
  .dns-list::-webkit-scrollbar { width: 0; }

  .dns-card { background: linear-gradient(135deg, rgba(60, 0, 80, 0.55), rgba(40, 0, 60, 0.45));
    border: 1.5px solid rgba(255, 0, 80, 0.22); border-radius: 14px;
    padding: 12px 14px; backdrop-filter: blur(15px); transition: all 0.25s; position: relative; }
  .dns-card.selected { border-color: #FF0040;
    box-shadow: 0 0 22px rgba(255, 0, 80, 0.4);
    background: linear-gradient(135deg, rgba(90, 0, 110, 0.7), rgba(60, 0, 80, 0.6)); }
  .dns-card.installed::after { content: '✓ CÀI'; position: absolute; top: 10px; right: 10px;
    background: linear-gradient(90deg, #00ff88, #00cc66); color: #000;
    font-size: 9px; font-weight: 900; padding: 3px 8px; border-radius: 6px; letter-spacing: 0.5px; }
  .dns-row { display: flex; align-items: center; gap: 12px; cursor: pointer; }
  .dns-icon-box { width: 40px; height: 40px; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 19px; flex-shrink: 0; border: 1px solid rgba(255, 255, 255, 0.08); }
  .dns-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .dns-name { font-size: 15px; font-weight: 700; color: #fff;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    display: flex; align-items: center; gap: 6px; }
  .dns-name-text { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dns-badge { display: inline-flex; align-items: center;
    background: linear-gradient(90deg, #FF0040, #FF00FF); color: #fff;
    font-size: 8px; font-weight: 900; padding: 2px 6px; border-radius: 4px;
    letter-spacing: 0.3px; flex-shrink: 0; box-shadow: 0 0 8px rgba(255, 0, 80, 0.5); }
  .dns-sub { font-size: 11px; color: rgba(255, 180, 220, 0.6);
    font-style: italic; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dns-check { font-size: 20px; color: #FF00FF; opacity: 0; transform: scale(0.5);
    transition: all 0.25s; text-shadow: 0 0 10px #FF00FF; flex-shrink: 0; }
  .dns-card.selected .dns-check { opacity: 1; transform: scale(1); }

  .dns-details { display: none; margin-top: 12px; padding-top: 12px;
    border-top: 1px dashed rgba(255, 0, 80, 0.25); }
  .dns-card.selected .dns-details { display: block; animation: slideDown 0.3s ease; }
  @keyframes slideDown { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }
  .detail-section { margin-bottom: 10px; }
  .detail-title { font-size: 9px; font-weight: 800; color: rgba(255, 100, 180, 0.9);
    letter-spacing: 1.5px; margin-bottom: 6px; padding-left: 8px; border-left: 2px solid #FF0040; }
  .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px 10px;
    padding: 8px 10px; background: rgba(0, 0, 0, 0.35); border-radius: 8px; }
  .detail-item { display: flex; justify-content: space-between; align-items: center;
    gap: 6px; font-size: 10px; padding: 2px 0; }
  .detail-label { color: rgba(255, 150, 200, 0.7); white-space: nowrap; }
  .detail-value { color: #FF00FF; font-family: 'Courier New', monospace;
    font-weight: 700; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; max-width: 90px; text-align: right; }
  .detail-grid.purple .detail-value { color: #9B30FF; }
  .detail-grid.purple .detail-label { color: rgba(180, 150, 255, 0.7); }

  .dns-actions { display: none; gap: 8px; margin-top: 12px; }
  .dns-card.selected .dns-actions { display: flex; }
  .btn-small { flex: 1; padding: 10px 8px; border: none; border-radius: 10px;
    font-size: 11px; font-weight: 800; letter-spacing: 0.3px; cursor: pointer;
    transition: all 0.2s; display: flex; align-items: center;
    justify-content: center; gap: 4px; white-space: nowrap; }
  .btn-small:active { transform: scale(0.96); }
  .btn-install { background: linear-gradient(90deg, #FF0040, #9B30FF); color: #fff;
    box-shadow: 0 4px 12px rgba(255, 0, 80, 0.4); }
  .btn-install.installed { background: linear-gradient(90deg, #00ff88, #00cc66); color: #000;
    box-shadow: 0 4px 12px rgba(0, 255, 136, 0.3); }
  .btn-config { background: rgba(155, 48, 255, 0.2); color: #FF00FF;
    border: 1px solid rgba(255, 0, 255, 0.4); }

  .ff-buttons { padding: 12px 14px 18px; background: rgba(0, 0, 0, 0.6);
    backdrop-filter: blur(20px); display: flex; gap: 10px;
    border-top: 1px solid rgba(255, 0, 80, 0.2); flex-shrink: 0; }
  .btn-ff { flex: 1; padding: 13px 10px; border: none; border-radius: 13px;
    color: #fff; font-size: 12.5px; font-weight: 800; letter-spacing: 1px;
    cursor: pointer; transition: all 0.3s; display: flex;
    flex-direction: column; align-items: center; gap: 3px; }
  .btn-ff:active { transform: scale(0.96); }
  .btn-ff-normal { background: linear-gradient(90deg, #4a0080, #9B30FF);
    box-shadow: 0 6px 20px rgba(155, 48, 255, 0.5); }
  .btn-ff-maxx { background: linear-gradient(90deg, #FF0040, #FF6600);
    box-shadow: 0 6px 20px rgba(255, 0, 64, 0.5); }
  .btn-ff-icon { font-size: 18px; }

  /* MODAL */
  .modal-overlay { position: fixed; inset: 0; background: rgba(10, 0, 20, 0.85);
    backdrop-filter: blur(6px); display: none; align-items: flex-end;
    justify-content: center; z-index: 100; }
  .modal-overlay.show { display: flex; }
  .modal { width: 100%; max-width: 480px;
    background: linear-gradient(180deg, #1a0033, #2d004d);
    border-top-left-radius: 24px; border-top-right-radius: 24px;
    padding: 18px 20px 28px; animation: slideUp 0.3s ease-out;
    max-height: 92vh; overflow-y: auto; border-top: 2px solid #FF0040;
    box-shadow: 0 -10px 40px rgba(255, 0, 80, 0.3); }
  .modal::-webkit-scrollbar { width: 0; }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .modal-handle { width: 40px; height: 4px;
    background: linear-gradient(90deg, #FF0040, #9B30FF);
    border-radius: 5px; margin: 0 auto 14px; }
  .modal-title { font-size: 18px; font-weight: 800; margin-bottom: 4px;
    background: linear-gradient(90deg, #FF0040, #FF00FF);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text; }
  .modal-sub { font-size: 12px; color: rgba(255, 180, 220, 0.6); margin-bottom: 16px; }
  .modal-section { font-size: 10px; font-weight: 800; color: rgba(255, 100, 180, 0.8);
    letter-spacing: 2px; margin: 16px 0 8px; padding-left: 10px; border-left: 3px solid #FF0040; }
  .modal-field { margin-bottom: 11px; }
  .modal-label { display: block; font-size: 10px; color: rgba(255, 150, 200, 0.75);
    text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; font-weight: 700; }
  .modal-input { width: 100%; padding: 11px 13px; background: rgba(0, 0, 0, 0.5);
    border: 1px solid rgba(255, 0, 80, 0.25); border-radius: 10px; color: #fff;
    font-size: 13.5px; font-family: 'Courier New', monospace; outline: none;
    transition: border 0.2s; }
  .modal-input:focus { border-color: #FF0040; box-shadow: 0 0 0 3px rgba(255, 0, 80, 0.2); }
  .modal-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .modal-buttons { display: flex; gap: 10px; margin-top: 20px; }
  .btn-modal { flex: 1; padding: 13px; border-radius: 12px; border: none;
    font-size: 13px; font-weight: 800; cursor: pointer; transition: all 0.2s;
    display: flex; align-items: center; justify-content: center; gap: 6px; letter-spacing: 0.5px; }
  .btn-modal:active { transform: scale(0.97); }
  .btn-modal-cancel { background: rgba(255, 255, 255, 0.08); color: #fff;
    border: 1px solid rgba(255, 255, 255, 0.15); }
  .btn-modal-save { background: linear-gradient(90deg, #FF0040, #9B30FF); color: #fff;
    box-shadow: 0 4px 20px rgba(255, 0, 80, 0.5); }

  /* TOAST */
  .toast { position: fixed; bottom: 100px; left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: rgba(20, 0, 30, 0.95); border: 1.5px solid #FF0040;
    color: #fff; padding: 12px 22px; border-radius: 30px;
    font-size: 13px; font-weight: 700; opacity: 0; transition: all 0.4s;
    pointer-events: none; z-index: 200; white-space: nowrap; max-width: 90%;
    overflow: hidden; text-overflow: ellipsis;
    box-shadow: 0 0 30px rgba(255, 0, 80, 0.4); backdrop-filter: blur(15px); }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.success { border-color: #00ff88; box-shadow: 0 0 30px rgba(0, 255, 136, 0.4); }
  .toast.error { border-color: #FF0040; }

  /* LOADING OVERLAY (cài DNS) */
  .loading-overlay { position: fixed; inset: 0; background: rgba(10, 0, 20, 0.92);
    backdrop-filter: blur(10px); display: none; flex-direction: column;
    align-items: center; justify-content: center; z-index: 300; gap: 16px; }
  .loading-overlay.show { display: flex; }
  .loading-spinner { width: 60px; height: 60px;
    border: 4px solid rgba(255, 0, 80, 0.15); border-top-color: #FF0040;
    border-right-color: #9B30FF; border-radius: 50%; animation: spin 0.9s linear infinite; }
  .loading-text { font-size: 14px; color: #FF00FF; font-weight: 700;
    letter-spacing: 1.5px; text-shadow: 0 0 15px rgba(255, 0, 255, 0.5); }
  .loading-bar { width: 240px; height: 5px; background: rgba(255, 255, 255, 0.08);
    border-radius: 5px; overflow: hidden; margin-top: 8px; }
  .loading-bar-fill { height: 100%;
    background: linear-gradient(90deg, #FF0040, #FF00FF); width: 0%;
    transition: width 0.3s; border-radius: 5px; box-shadow: 0 0 15px #FF0040; }
</style>
</head>
<body>

<div class="app">

  <div id="loadingScreen">
    <div class="load-logo">🔓</div>
    <div class="load-title">ĐANG XÁC THỰC</div>
    <div class="load-status" id="loadStatus">Đang kiểm tra key...</div>
    <div class="load-bar"><div class="load-bar-fill" id="loadBarFill"></div></div>
    <div class="load-percent" id="loadPercent">0%</div>
  </div>

  <div id="authScreen">
    <div class="logo-wrap"><div class="logo-circle">🔒</div></div>
    <div class="app-name">X LOCK</div>
    <div class="app-sub">DNS MAXX FF PREMIUM</div>
    <div class="input-label">KEY BẢN QUYỀN</div>
    <input type="text" id="keyInput" class="key-input" placeholder="LOCK_XXXXX_FF" autocomplete="off" spellcheck="false">
    <div class="error-msg" id="errorMsg"></div>
    <button class="btn-activate" id="btnActivate" onclick="validateKey()">
      <div class="spinner" id="spinner"></div>
      <span id="btnText">🔓 KÍCH HOẠT</span>
    </button>
    <div class="device-info" id="deviceInfo">Device: LOADING...</div>
  </div>

  <div id="mainScreen">
    <div class="header">
      <div class="header-top">
        <div class="header-left">
          <div class="header-title">X LOCK</div>
          <div class="header-status"><div class="dot"></div><span id="keyTypeLabel">ĐANG HOẠT ĐỘNG</span></div>
        </div>
        <div class="header-right">
          <div class="ping-value" id="pingValue">-- ms</div>
          <div class="ping-label">PING</div>
        </div>
      </div>
      <div class="time-box">
        <div class="time-label">⏱ Thời gian:</div>
        <div class="time-value" id="timeValue">--:--:--</div>
      </div>
    </div>
    <div class="dns-list" id="dnsList"></div>
    <div class="ff-buttons">
      <button class="btn-ff btn-ff-normal" onclick="activateFF('normal')">
        <div class="btn-ff-icon">⚡</div><div>FF THƯỜNG</div>
      </button>
      <button class="btn-ff btn-ff-maxx" onclick="activateFF('maxx')">
        <div class="btn-ff-icon">🔥</div><div>FF MAXX</div>
      </button>
    </div>
  </div>

  <div class="modal-overlay" id="aimModal" onclick="if(event.target===this)closeModal()">
    <div class="modal" onclick="event.stopPropagation()">
      <div class="modal-handle"></div>
      <div class="modal-title">🎯 CẤU HÌNH AIM LOCK</div>
      <div class="modal-sub" id="aimModalSub">DNS: HEAD 🔥</div>
      <div class="modal-section">AIM SETTINGS</div>
      <div class="modal-grid">
        <div class="modal-field"><label class="modal-label">Sensitivity</label><input type="text" class="modal-input" id="aimSensi" value="100"></div>
        <div class="modal-field"><label class="modal-label">Range</label><input type="text" class="modal-input" id="aimRange" value="50"></div>
        <div class="modal-field"><label class="modal-label">Head Offset</label><input type="text" class="modal-input" id="aimHead" value="15"></div>

function getDeviceID() {
  let id = localStorage.getItem("xlock_device_id");
  if (!id) {
    id = "DEV-" + Math.random().toString(36).substring(2, 10).toUpperCase()
       + Math.random().toString(36).substring(2, 6).toUpperCase();
    localStorage.setItem("xlock_device_id", id);
  }
  return id;
}

function showError(msg) { const el = document.getElementById("errorMsg"); el.textContent = msg; el.classList.add("show"); }
function hideError() { document.getElementById("errorMsg").classList.remove("show"); }
function showToast(msg, type = "") {
  const toast = document.getElementById("toast");
  toast.textContent = msg;
  toast.className = "toast show " + type;
  clearTimeout(toast._timeout);
  toast._timeout = setTimeout(() => toast.classList.remove("show"), 2200);
}

/* ===== LOADING SCREEN ===== */
function showLoadingScreen(steps, onComplete) {
  const screen = document.getElementById("loadingScreen");
  const bar = document.getElementById("loadBarFill");
  const percent = document.getElementById("loadPercent");
  const status = document.getElementById("loadStatus");

  screen.style.display = "flex";
  bar.style.width = "0%";
  percent.textContent = "0%";

  let progress = 0, stepIndex = 0;
  const interval = setInterval(() => {
    progress += Math.random() * 12 + 6;
    if (progress > 100) progress = 100;

    bar.style.width = progress + "%";
    percent.textContent = Math.floor(progress) + "%";

    const newIndex = Math.min(Math.floor(progress / (100 / steps.length)), steps.length - 1);
    if (newIndex !== stepIndex || progress < 5) {
      stepIndex = newIndex;
      status.textContent = steps[stepIndex];
    }

    if (progress >= 100) {
      clearInterval(interval);
      status.textContent = "Hoàn tất!";

      setTimeout(() => {
        // ẨN loading
        screen.style.display = "none";

        // HIỆN main
        const main = document.getElementById("mainScreen");
        main.style.display = "flex";

        if (onComplete) onComplete();
      }, 500);
    }
  }, 180);
}

/* ===== VALIDATE KEY ===== */
function validateKey() {
  const input = document.getElementById("keyInput");
  const key = input.value.trim().toUpperCase();
  const btn = document.getElementById("btnActivate");
  const btnText = document.getElementById("btnText");
  const spinner = document.getElementById("spinner");

  hideError();

  if (!key) { showError("⚠️ Vui lòng nhập Key!"); return; }
  if (!key.startsWith("LOCK") || !key.endsWith("FF")) {
    showError("❌ Key phải bắt đầu LOCK và kết thúc FF!"); return;
  }

  btn.disabled = true;
  btnText.textContent = "ĐANG KIỂM TRA...";
  spinner.classList.add("show");

  setTimeout(() => {
    if (!VALID_KEYS[key]) {
      btn.disabled = false; btnText.textContent = "🔓 KÍCH HOẠT";
      spinner.classList.remove("show");
      showError("❌ Key không hợp lệ!");
      return;
    }

    const savedDevice = localStorage.getItem("xlock_used_" + key);
    if (savedDevice && savedDevice !== DEVICE_ID) {
      btn.disabled = false; btnText.textContent = "🔓 KÍCH HOẠT";
      spinner.classList.remove("show");
      showError("⚠️ Key đã dùng trên thiết bị khác!");
      return;
    }

    localStorage.setItem("xlock_used_" + key, DEVICE_ID);
    localStorage.setItem("xlock_current_key", key);

    const keyData = VALID_KEYS[key];
    state.activated = true;
    state.currentKey = key;
    state.keyType = keyData;

    if (keyData.duration !== null) {
      state.expiryTime = Date.now() + keyData.duration * 1000;
      localStorage.setItem("xlock_expiry", state.expiryTime);
    } else {
      state.expiryTime = null;
      localStorage.removeItem("xlock_expiry");
    }

    btn.disabled = false; btnText.textContent = "🔓 KÍCH HOẠT";
    spinner.classList.remove("show");

    showLoadingScreen([
      "🔐 Đang xác thực key...",
      "📡 Đang kết nối server X LOCK...",
      "🎯 Đang tải cấu hình AIM LOCK...",
      "🌐 Đang tải cấu hình DNS...",
      "✅ Kích hoạt thành công!"
    ], () => {
      // Ẩn auth
      document.getElementById("authScreen").style.display = "none";

      document.getElementById("keyTypeLabel").textContent = keyData.label;
      renderDNSList();
      startTimers();
      showToast("🎉 Kích hoạt thành công!", "success");
    });
  }, 1200);
}

/* ===== TIMERS ===== */
function startTimers() {
  updateTime(); updatePing();
  if (state.timeTimer) clearInterval(state.timeTimer);
  if (state.pingTimer) clearInterval(state.pingTimer);
  state.timeTimer = setInterval(updateTime, 1000);
  state.pingTimer = setInterval(updatePing, 2000);
}
function updateTime() {
  const el = document.getElementById("timeValue");
  if (!el) return;
  if (!state.expiryTime) { el.textContent = "∞ VĨNH VIỄN"; return; }
  const remaining = state.expiryTime - Date.now();
  if (remaining <= 0) {
    el.textContent = "00:00:00";
    setTimeout(() => {
      document.body.innerHTML = `<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;background:linear-gradient(135deg,#4a0000,#9B30FF,#1a0033);color:#fff;font-family:sans-serif;text-align:center;padding:20px;"><div style="font-size:80px;margin-bottom:20px;">🔒</div><h1 style="font-size:28px;">KEY ĐÃ HẾT HẠN</h1><button onclick="location.reload()" style="margin-top:30px;padding:14px 30px;border:none;border-radius:12px;background:#000;color:#FF0040;font-weight:bold;cursor:pointer;">🔄 KHỞI ĐỘNG LẠI</button></div>`;
    }, 500);
    return;
  }
  const days = Math.floor(remaining / 86400000);
  const hours = Math.floor((remaining % 86400000) / 3600000);
  const minutes = Math.floor((remaining % 3600000) / 60000);
  const seconds = Math.floor((remaining % 60000) / 1000);
  if (days > 0) el.textContent = `${days}d ${hours}h ${minutes}m`;
  else el.textContent = `${String(hours).padStart(2,'0')}:${String(minutes).padStart(2,'0')}:${String(seconds).padStart(2,'0')}`;
}
function updatePing() {
  state.ping = Math.floor(Math.random() * 60) + 15;
  const el = document.getElementById("pingValue");
  if (!el) return;
  el.textContent = state.ping + " ms";
  if (state.ping < 30) el.style.color = "#00ff88";
  else if (state.ping < 50) el.style.color = "#FF00FF";
  else el.style.color = "#FF0040";
}

/* ===== INSTALL DNS (mobileconfig) ===== */
function generateMobileConfig(dns) {
  function makeUUID() {
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
      const r = Math.random() * 16 | 0;
      const v = c === 'x' ? r : (r & 0x3 | 0x8);
      return v.toString(16).toUpperCase();
    });
  }
  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;').replace(/'/g, '&apos;');
  }

  const profileUUID = makeUUID();
  const dnsUUID = makeUUID();
  const proto = (dns.protocol || "DoH").toUpperCase();
  let dnsProtocol = "HTTPS";
  if (proto === "DOT" || proto === "TLS") dnsProtocol = "TLS";
  else if (proto === "CLEARTEXT") dnsProtocol = "Cleartext";

  let dnsSettings = '';
  if (dnsProtocol === "Cleartext") {
    dnsSettings = `<key>DNSProtocol</key><string>Cleartext</string>
        <key>ServerAddresses</key><array>
          <string>${esc(dns.primary)}</string>
          <string>${esc(dns.secondary)}</string>
        </array>`;
  } else {
    let serverURL = dns.dohUrl || "https://cloudflare-dns.com/dns-query";
    if (dnsProtocol === "TLS" && serverURL.startsWith("https://")) {
      serverURL = serverURL.replace("https://", "tls://");
    }
    dnsSettings = `<key>DNSProtocol</key><string>${dnsProtocol}</string>
        <key>ServerURL</key><string>${esc(serverURL)}</string>`;
  }

  return `<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
  <key>PayloadContent</key>
  <array>
    <dict>
      <key>DNSSettings</key>
      <dict>${dnsSettings}</dict>
      <key>PayloadDescription</key>
      <string>Cấu hình DNS ${esc(dns.displayName)} - X LOCK</string>
      <key>PayloadDisplayName</key>
      <string>${esc(dns.displayName)} - X LOCK</string>
      <key>PayloadIdentifier</key>
      <string>com.xlock.dns.${dnsUUID}</string>
      <key>PayloadType</key>
      <string>com.apple.dnsSettings.managed</string>
      <key>PayloadUUID</key>
      <string>${dnsUUID}</string>
      <key>PayloadVersion</key>
      <integer>1</integer>
    </dict>
  </array>
  <key>PayloadDescription</key>
  <string>Profile DNS ${esc(dns.displayName)} - X LOCK</string>
  <key>PayloadDisplayName</key>
  <string>X LOCK - ${esc(dns.displayName)}</string>
  <key>PayloadIdentifier</key>
  <string>com.xlock.profile.${profileUUID}</string>
  <key>PayloadOrganization</key>
  <string>X LOCK</string>
  <key>PayloadRemovalDisallowed</key>
  <false/>
  <key>PayloadType</key>
  <string>Configuration</string>
  <key>PayloadUUID</key>
  <string>${profileUUID}</string>
  <key>PayloadVersion</key>
  <integer>1</integer>
</dict>
</plist>`;
}

function downloadMobileConfig(dns) {
  try {
    const content = generateMobileConfig(dns.dns);
    const blob = new Blob([content], { type: "application/x-apple-aspen-config" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `X-LOCK-${dns.id}.mobileconfig`;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 2000);
    return true;
  } catch (err) {
    showToast("❌ Lỗi: " + err.message, "error");
    return false;
  }
}

function installDNS(dnsId) {
  const dns = DNS_LIST.find(d => d.id === dnsId);
  if (!dns || !dns.dns) { showToast("⚠️ Chưa có cấu hình DNS!", "error"); return; }

  const overlay = document.getElementById("loadingOverlay");
  const bar = document.getElementById("loadingBar");
  const text = document.getElementById("loadingText");
  overlay.style.display = "flex";
  bar.style.width = "0%";

  let progress = 0;
  const steps = ["Đang tạo profile...", "Đang mã hóa...", "Đang áp dụng AIM...", "Đang tạo mobileconfig...", "Hoàn tất!"];
  const interval = setInterval(() => {
    progress += Math.random() * 18 + 5;
    if (progress >= 100) progress = 100;
    bar.style.width = progress + "%";
    text.textContent = steps[Math.min(Math.floor(progress / 25), steps.length - 1)] + " " + Math.floor(progress) + "%";

    if (progress >= 100) {
      clearInterval(interval);
      setTimeout(() => {
        overlay.style.display = "none";
        if (downloadMobileConfig(dns)) {
          dns.installed = true;
          saveDNSState();
          renderDNSList();
          showIOSGuide(dns);
        }
      }, 400);
    }
  }, 250);
}

  guide.innerHTML = `
    <div style="width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,#00ff88,#00cc66);display:flex;align-items:center;justify-content:center;font-size:40px;margin-bottom:20px;box-shadow:0 0 40px rgba(0,255,136,0.6);">✅</div>
    <h2 style="font-size:22px;font-weight:900;margin-bottom:8px;background:linear-gradient(90deg,#FF0040,#FF00FF);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-align:center;">ĐÃ TẢI PROFILE DNS</h2>
    <p style="font-size:13px;color:rgba(255,180,220,0.7);margin-bottom:25px;text-align:center;">File <b style="color:#FF00FF;">X-LOCK-${dns.id}.mobileconfig</b> đã tải về</p>
    <div style="width:100%;max-width:340px;background:rgba(0,0,0,0.5);border:1px solid rgba(255,0,80,0.3);border-radius:14px;padding:16px;margin-bottom:20px;">
      <div style="font-size:11px;color:#FF00FF;font-weight:800;letter-spacing:1.5px;margin-bottom:12px;">📱 HƯỚNG DẪN:</div>
      <ol style="font-size:12px;color:rgba(255,255,255,0.85);padding-left:20px;line-height:1.9;">
        <li>Mở <b>Settings (Cài đặt)</b></li>
        <li>Vào <b>General → VPN & Device Management</b></li>
        <li>Nhấn <b>Profile Downloaded</b></li>
        <li>Nhấn <b>Install</b> → nhập mật khẩu</li>
        <li>Kiểm tra tại <b>Settings → General → About → DNS</b></li>
      </ol>
    </div>
    <button onclick="this.parentElement.remove()" style="padding:14px 40px;border:none;border-radius:12px;background:linear-gradient(90deg,#FF0040,#9B30FF);color:#fff;font-size:14px;font-weight:800;letter-spacing:1px;cursor:pointer;box-shadow:0 8px 30px rgba(255,0,80,0.5);">ĐÃ HIỂU</button>`;
  document.body.appendChild(guide);

/* ===== MODAL ===== */
function openAimModal(dnsId) {
  const dns = DNS_LIST.find(d => d.id === dnsId);
  if (!dns || !dns.aim) return;
  state.editingAimDNS = dnsId;
  document.getElementById("aimModalSub").textContent = `DNS: ${dns.name}`;
  document.getElementById("aimSensi").value = dns.aim.sensi;
  document.getElementById("aimRange").value = dns.aim.range;
  document.getElementById("aimHead").value = dns.aim.head;
  document.getElementById("aimDrag").value = dns.aim.drag;
  document.getElementById("aimSmooth").value = dns.aim.smooth;
  document.getElementById("aimTrigger").value = dns.aim.trigger;
  document.getElementById("aimServer").value = dns.aim.server;
  document.getElementById("aimModal").classList.add("show");
}
function saveAimConfig() {
  const dns = DNS_LIST.find(d => d.id === state.editingAimDNS);
  if (!dns) return;
  dns.aim = { sensi: document.getElementById("aimSensi").value, range: document.getElementById("aimRange").value,
    head: document.getElementById("aimHead").value, drag: document.getElementById("aimDrag").value,
    smooth: document.getElementById("aimSmooth").value, trigger: document.getElementById("aimTrigger").value,
    server: document.getElementById("aimServer").value };
  saveDNSState(); closeModal(); renderDNSList();
  showToast(`💾 Đã lưu AIM cho ${dns.name}`, "success");
}
function openDnsModal(dnsId) {
  const dns = DNS_LIST.find(d => d.id === dnsId);
  if (!dns || !dns.dns) return;
  state.editingDnsDNS = dnsId;
  document.getElementById("dnsModalSub").textContent = `DNS: ${dns.name}`;
  document.getElementById("dnsPrimary").value = dns.dns.primary;
  document.getElementById("dnsSecondary").value = dns.dns.secondary;
  document.getElementById("dnsPrimaryV6").value = dns.dns.primaryV6;
  document.getElementById("dnsProtocol").value = dns.dns.protocol;
  document.getElementById("dnsDohUrl").value = dns.dns.dohUrl;
  document.getElementById("dnsPort").value = dns.dns.port;
  document.getElementById("dnsTimeout").value = dns.dns.timeout;
  document.getElementById("dnsDisplayName").value = dns.dns.displayName;
  document.getElementById("dnsNote").value = dns.dns.note;
  document.getElementById("dnsModal").classList.add("show");
}
function saveDNSConfig() {
  const dns = DNS_LIST.find(d => d.id === state.editingDnsDNS);
  if (!dns) return;
  dns.dns = { primary: document.getElementById("dnsPrimary").value, secondary: document.getElementById("dnsSecondary").value,
    primaryV6: document.getElementById("dnsPrimaryV6").value, protocol: document.getElementById("dnsProtocol").value,
    dohUrl: document.getElementById("dnsDohUrl").value, port: document.getElementById("dnsPort").value,
    timeout: document.getElementById("dnsTimeout").value, displayName: document.getElementById("dnsDisplayName").value,
    note: document.getElementById("dnsNote").value };
  dns.sub = dns.dns.note;
  saveDNSState(); closeModal(); renderDNSList();
  showToast(`💾 Đã lưu DNS cho ${dns.name}`, "success");
}
function closeModal() { document.querySelectorAll(".modal-overlay").forEach(m => m.classList.remove("show")); }

function activateFF(mode) {
  const modeName = mode === "normal" ? "⚡ FF THƯỜNG" : "🔥 FF MAXX";
  const dns = DNS_LIST.find(d => d.name === state.selectedDNS);
  if (!dns) { showToast("⚠️ Chưa chọn DNS", "error"); return; }
  if (dns.aim && !dns.installed) { showToast("📥 Hãy cài DNS vào máy trước!", "error"); return; }
  showToast(`${modeName} đã bật - DNS: ${dns.name}`, "success");
}

function saveDNSState() { localStorage.setItem("xlock_dns_list", JSON.stringify(DNS_LIST)); }
function loadDNSState() {
  const saved = localStorage.getItem("xlock_dns_list");
  if (saved) {
    try {
      const parsed = JSON.parse(saved);
      if (Array.isArray(parsed) && parsed.length === DNS_LIST.length) DNS_LIST = parsed;
    } catch(e) {}
  }
}

window.addEventListener("DOMContentLoaded", () => {
  loadDNSState();
  renderDNSList();

  const savedKey = localStorage.getItem("xlock_current_key");
  const savedExpiry = localStorage.getItem("xlock_expiry");

  if (savedKey && VALID_KEYS[savedKey]) {
    const usedDevice = localStorage.getItem("xlock_used_" + savedKey);
    if (usedDevice !== DEVICE_ID) { localStorage.removeItem("xlock_current_key"); return; }
    const keyData = VALID_KEYS[savedKey];
    const expiry = savedExpiry ? parseInt(savedExpiry) : null;
    if (keyData.duration === null || (expiry && expiry > Date.now())) {
      state.activated = true;
      state.currentKey = savedKey;
      state.keyType = keyData;
      state.expiryTime = keyData.duration === null ? null : expiry;
      document.getElementById("authScreen").style.display = "none";
      document.getElementById("mainScreen").style.display = "flex";
      document.getElementById("keyTypeLabel").textContent = keyData.label;
      renderDNSList(); startTimers();
    } else localStorage.removeItem("xlock_current_key");
  }

  document.getElementById("keyInput").addEventListener("keydown", e => {
    if (e.key === "Enter") validateKey();
  });
});
</script>
